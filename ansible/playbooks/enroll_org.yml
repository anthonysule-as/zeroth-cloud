---
# Zeroth Cloud v3 — Organization Enrollment Playbook
# Zero-downtime enrollment for new beneficiary organizations.
# Called by scripts/enroll_org.sh — do not run directly.
#
# Required extra vars:
#   org_name          e.g. org31
#   org_id            e.g. 31
#   risk_tier         dedicated | shared
#   wireguard_subnet  e.g. <REDACTED_IP_1>/24
#   wg_org_public_key (generated by enroll_org.sh)

- name: "Validate and record org: {{ org_name }}"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Validate org_id range
      ansible.builtin.assert:
        that:
          - org_id | int >= 1
          - org_id | int <= 255
        fail_msg: "org_id must be between 1 and 255"

    - name: Create orgs inventory directory
      ansible.builtin.file:
        path: ansible/inventory/orgs
        state: directory
        mode: "0750"

    - name: Record org metadata to inventory
      ansible.builtin.copy:
        content: |
          org_name: {{ org_name }}
          org_id: {{ org_id }}
          risk_tier: {{ risk_tier }}
          wireguard_subnet: {{ wireguard_subnet }}
          wg_public_key: {{ wg_org_public_key }}
          enrolled_at: "{{ ansible_date_time.iso8601 }}"
        dest: "/root/zeroth-cloud/ansible/inventory/orgs/{{ org_name }}.yml"
        mode: "0640"

# ─── STEP 1: WIREGUARD — Add peer (wg syncconf, no restart) ──────────────────
- name: "Step 1 — WireGuard: add peer for {{ org_name }}"
  hosts: wireguard_gateways
  become: true
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Append new org peer block to wg0.conf
      ansible.builtin.blockinfile:
        path: /etc/wireguard/wg0.conf
        marker: "# {mark} ORG {{ org_id }} ({{ org_name }})"
        block: |
          [Peer]
          # Org {{ org_id }}: {{ org_name }}
          PublicKey  = {{ wg_org_public_key }}
          AllowedIPs = {{ wireguard_subnet }}

    - name: Reload WireGuard peer config (syncconf — zero downtime)
      ansible.builtin.shell: |
        wg syncconf wg0 <(wg-quick strip wg0)
      args:
        executable: /bin/bash
      # Existing org tunnels are NOT interrupted

    - name: Update iptables isolation rules to include new org
      ansible.builtin.template:
        src: ../templates/wireguard/iptables-isolation.sh.j2
        dest: /etc/wireguard/iptables-isolation.sh
        mode: "0700"

    - name: Apply updated iptables isolation rules
      ansible.builtin.command: bash /etc/wireguard/iptables-isolation.sh

# ─── STEP 2: JUMPSERVER — Create asset group ─────────────────────────────────
- name: "Step 2 — JumpServer: create asset group for {{ org_name }}"
  hosts: jumpserver
  become: true
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Authenticate to JumpServer API
      ansible.builtin.uri:
        url: "http://<REDACTED_IP_14>/api/v1/authentication/auth/"
        method: POST
        headers:
          Content-Type: application/json
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_jumpserver_admin_password }}"
        validate_certs: false
        status_code: [200, 201, 400]
      register: jumpserver_auth

    - name: Create JumpServer asset group via API
      ansible.builtin.uri:
        url: "http://<REDACTED_IP_14>/api/v1/assets/nodes/"
        method: POST
        headers:
          Authorization: "Bearer {{ jumpserver_auth.json.token }}"
          Content-Type: application/json
        body_format: json
        body:
          value: "{{ org_name }}"
          full_value: "Default/{{ org_name }}"
        validate_certs: false
        status_code: [200, 201, 400]

# ─── STEP 3: WAZUH — Configure agent group ────────────────────────────────────
- name: "Step 3 — Wazuh: configure agent group for {{ org_name }}"
  hosts: "{{ 'wazuh-mgr-%02d' | format(org_id | int) if risk_tier == 'dedicated' else 'wazuh_shared' }}"
  become: true
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Create Wazuh agent group directory for org
      ansible.builtin.file:
        path: "{{ wazuh_shared_config_dir }}/{{ org_name }}"
        state: directory
        owner: root
        group: wazuh
        mode: "0750"

    - name: Deploy agent group config for org
      ansible.builtin.template:
        src: ../templates/wazuh/agent-group.conf.j2
        dest: "{{ wazuh_shared_config_dir }}/{{ org_name }}/agent.conf"
        owner: root
        group: wazuh
        mode: "0640"
      vars:
        org_id_var: "{{ org_id }}"

# ─── STEP 4: OPENSEARCH — Index template ─────────────────────────────────────
- name: "Step 4 — OpenSearch: create index template for {{ org_name }}"
  hosts: opensearch
  run_once: true
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Create per-org index template in OpenSearch
      ansible.builtin.uri:
        url: "http://{{ wg_overlay_ip }}:{{ opensearch_http_port }}/_index_template/wazuh-{{ org_name }}"
        method: PUT
        user: admin
        password: "{{ vault_opensearch_admin_password }}"
        validate_certs: false
        body_format: json
        body:
          index_patterns: ["wazuh-alerts-{{ org_name }}-*"]
          template:
            settings:
              number_of_shards: 1
              number_of_replicas: 1
          priority: 100
        status_code: [200, 201, 400]

# ─── STEP 5: THEHIVE — Create organisation ────────────────────────────────────
- name: "Step 5 — TheHive: create organisation for {{ org_name }}"
  hosts: analytics
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Create TheHive organisation via API
      # NOTE: TheHive Community license limits to 1 org.
      # If license is upgraded, remove ignore_errors.
      # With community license, use case tags for per-org isolation.
      ignore_errors: true
      ansible.builtin.uri:
        url: "http://localhost:{{ thehive_port }}/api/v1/organisation"
        method: POST
        headers:
          Authorization: "Bearer {{ thehive_admin_api_key }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ org_name }}"
          description: "Zeroth Cloud beneficiary — org {{ org_id }}"
        status_code: [200, 201, 400]

# ─── STEP 6: GRAFANA — Provision dashboard ────────────────────────────────────
- name: "Step 6 — Grafana: provision per-org dashboard"
  hosts: monitoring
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/secrets.yml

  tasks:

    - name: Generate org dashboard JSON from template
      ansible.builtin.template:
        src: ../../grafana/dashboards/org-template.json.j2
        dest: "/tmp/{{ org_name }}-dashboard.json"
        mode: "0640"

    - name: Read rendered dashboard JSON
      ansible.builtin.slurp:
        src: "/tmp/{{ org_name }}-dashboard.json"
      register: dashboard_json

    - name: Import org dashboard via Grafana API
      ansible.builtin.uri:
        url: "http://<REDACTED_IP_12>:3000/api/dashboards/db"
        method: POST
        user: admin
        password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
        body_format: json
        body:
          dashboard: "{{ dashboard_json.content | b64decode | from_json }}"
          overwrite: true
        status_code: [200]

    - name: Clean up temp dashboard file
      ansible.builtin.file:
        path: "/tmp/{{ org_name }}-dashboard.json"
        state: absent

- name: Enrollment summary
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Print enrollment summary
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════
          ENROLLMENT COMPLETE — {{ org_name }}
          ══════════════════════════════════════════════════
          Org name       : {{ org_name }}
          Org ID         : {{ org_id }}
          Risk tier      : {{ risk_tier }}
          WireGuard /24  : {{ wireguard_subnet }}
          ──────────────────────────────────────────────────
          ✓  WireGuard peer added    (wg syncconf — no restart)
          ✓  JumpServer group        Default/{{ org_name }}
          ✓  Wazuh agent group       {{ org_name }}
          ✓  OpenSearch template     wazuh-alerts-{{ org_name }}-*
          ✓  TheHive organisation    {{ org_name }}
          ✓  Grafana dashboard       provisioned
          ══════════════════════════════════════════════════
